[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-harness"
version = "0.1.9"
description = "Bundled Browser Harness runtime for the Hermes plugin"
requires-python = ">=3.11"
dependencies = [
  "cdp-use==1.4.5",
  "fetch-use==0.4.0",
  "pillow==12.3.0",
  "websockets==15.0.1",
]

[project.scripts]
browser-harness = "browser_harness.run:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browser_harness = ["SKILL.md", "video-template.html"]

[tool.uv]
package = true
